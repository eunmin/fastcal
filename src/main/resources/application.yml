spring:
  application:
    name: fastcal
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # R2DBC PostgreSQL
  r2dbc:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    pool:
      initial-size: 10
      max-size: 50
      max-idle-time: 30m

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          time-between-eviction-runs: 30s
          min-evictable-idle-time: 60s

  # WebFlux (Netty)
  webflux:
    base-path: /
  web:
    resources:
      add-mappings: false

# Server configuration
server:
  port: 8080
  netty:
    connection-timeout: 10s
    idle-timeout: 60s
    max-keep-alive-requests: 1000
  max-http-request-header-size: 8KB

# Logging - default to INFO for security (avoid sensitive data in logs)
logging:
  level:
    root: INFO
    com.fastcal: INFO
    org.springframework.r2dbc: INFO
    io.r2dbc.postgresql: INFO

# Actuator - restricted for security
management:
  endpoints:
    web:
      base-path: /internal/actuator
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: when_authorized
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      redis:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      redis:
        timeoutDuration: 2s
        cancelRunningFuture: true

# OAuth2 Resource Server (Keycloak)
oauth2:
  enabled: ${OAUTH2_ENABLED:false}
  issuer-uri: ${OAUTH2_ISSUER_URI:}

# LDAP Authentication
ldap:
  enabled: ${LDAP_ENABLED:true}
  url: ${LDAP_URL:ldap://localhost:389}
  base-dn: ${LDAP_BASE_DN:dc=fastcal,dc=local}
  user-dn-pattern: ${LDAP_USER_DN_PATTERN:uid={0},ou=People}
  manager-dn: ${LDAP_MANAGER_DN:cn=admin,dc=fastcal,dc=local}
  manager-password: ${LDAP_MANAGER_PASSWORD:admin123}

# CalDAV specific settings
caldav:
  realm: FastCal CalDAV Server
  server-info:
    product-id: -//FastCal//CalDAV Server//EN
    version: 1.0.0
  sync:
    token-prefix: http://fastcal.com/ns/sync/

# Error handling - don't expose internal details in production
app:
  error:
    include-details: false

---
# Development profile
spring:
  config:
    activate:
      on-profile: dev

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/fastcal_dev

logging:
  level:
    com.fastcal: TRACE

app:
  error:
    include-details: true
  cors:
    allowed-origins: http://localhost:8080,http://localhost:3000

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod

  r2dbc:
    pool:
      initial-size: 20
      max-size: 100

logging:
  level:
    root: WARN
    com.fastcal: INFO

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
